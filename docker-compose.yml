version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: each_skill_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: each_skill_system
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  backend:
    build: 
      context: ./backend 
      dockerfile: Dockerfile
    container_name: each_skill_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/each_skill_system
      - SPRING_DATASOURCE_USERNAME=username
      - SPRING_DATASOURCE_PASSWORD=password
      - YANDEX_S3_ACCESS_KEY=YCAJE9--OaSpzd-KrUD_8fLn6
      - YANDEX_S3_SECRET_KEY=YCOL23lYWX4C-_RX1lHNWIXwjQ9d8xfMe5T1xAWi
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    container_name: each_skill_frontend
    restart: unless-stopped
    ports:
      - "5173:80" 
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: