spring:
  application:
    name: each-with-a-skill
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

yandex:
  s3:
    bucket-name: myfirstbucket
    access-key: ${YANDEX_S3_ACCESS_KEY}
    secret-key: ${YANDEX_S3_SECRET_KEY}
    endpoint: https://storage.yandexcloud.net
    region: ru-central1

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # Сгенерированный 256-битный ключ
      expiration: 900000 # 15 минут
      refresh-token:
        expiration: 604800000 # 7 дней

logging:
  level:
    org:
      hibernate:
        SQL: WARN
        type:
          descriptor:
            sql:
              BasicBinder: WARN